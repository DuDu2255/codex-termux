name: Android APK

on:
  push:
    branches: [APK]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: python3 ci_run.py toolchain "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/cache@v5
        with:
          path: android/.runtime-cache
          key: codex-native-engine-${{ hashFiles('android/runtime.lock.json') }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Package verified native engine
        run: python3 ci_run.py engine python3 prepare_native.py
      - name: Build and test native application
        run: python3 ci_run.py gradle ./gradlew --no-daemon --stacktrace :native-app:testDebugUnitTest :native-app:assembleDebug
      - name: Inspect APK
        run: |
          mkdir -p output
          cp native-app/build/outputs/apk/debug/native-app-debug.apk output/Codex-Android-arm64-v8a.apk
          python3 ci_run.py inspect python3 inspect_apk.py output/Codex-Android-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/Codex-Android-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging output/Codex-Android-arm64-v8a.apk
          cd output
          sha256sum Codex-Android-arm64-v8a.apk > SHA256SUMS
          cp ../README.md README.md
      - uses: actions/upload-artifact@v6
        with:
          name: Codex-Android-arm64-v8a
          path: android/output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: native-test-results
          include-hidden-files: true
          path: |
            android/native-app/build/reports/tests/
            android/native-app/build/test-results/
            android/.build-logs/
