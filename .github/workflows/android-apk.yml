name: Android APK

on:
  push:
    branches: [APK]
    paths: ['android/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android toolchain
        run: python3 ci_run.py toolchain "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-30' 'build-tools;30.0.3' 'ndk;22.1.7171670'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '11'
      - uses: actions/cache@v5
        with:
          path: android/.runtime-cache
          key: codex-android-runtime-${{ hashFiles('android/runtime.lock.json') }}
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble verified offline runtime
        run: python3 ci_run.py runtime python3 prepare_runtime.py
      - name: Build and test
        run: python3 ci_run.py gradle ./gradlew --no-daemon --stacktrace :terminal-emulator:testDebugUnitTest :app:assembleDebug
      - name: Inspect APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/codex-terminal_debug_arm64-v8a.apk output/Codex-Terminal-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/30.0.3/apksigner" verify --verbose output/Codex-Terminal-arm64-v8a.apk
          "$ANDROID_HOME/build-tools/30.0.3/aapt" dump badging output/Codex-Terminal-arm64-v8a.apk
          sha256sum output/Codex-Terminal-arm64-v8a.apk > output/SHA256SUMS
          cp README.md output/README.md
      - uses: actions/upload-artifact@v6
        with:
          name: Codex-Terminal-arm64-v8a
          path: android/output/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: terminal-test-results
          path: |
            android/terminal-emulator/build/reports/tests/
            android/.build-logs/
